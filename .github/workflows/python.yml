name: Python
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest tests
        env:
          PYTHONPATH: src
      - run: docker build -f docker/orchestrator.Dockerfile -t reels-router-orchestrator:ci .
      - run: docker build -f docker/media.Dockerfile -t reels-router-media:ci .
      - run: docker build -f docker/frames.Dockerfile -t reels-router-frames:ci .
